<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Harish Nagaraju</title>
  <meta name="theme-color" content="#0b2a21" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon/favicon-16x16.png" />
  <link rel="icon" href="assets/images/favicon/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@600&family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    :root {
      --ivory: #faf7f0;
      --forest-900: #0b2a21;
      --forest-800: #0f3a2d;
      --forest-100: #e2efe8;
      --saffron: #e8792b;
      --saffron-600: #c9611a;
      --gold: #d9ab47;
      --ink: #15231d;
      --muted: #5a6962;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 90% -10%, rgba(232, 121, 43, 0.22), transparent 60%),
        radial-gradient(800px 500px at -10% 110%, rgba(47, 122, 95, 0.45), transparent 60%),
        var(--forest-900);
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 48px 32px 40px;
      border-radius: 24px;
      background: var(--ivory);
      text-align: center;
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.5);
    }

    .logo { height: 52px; width: auto; margin: 0 auto 32px; display: block; }

    .check {
      display: grid;
      place-items: center;
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: var(--forest-100);
      color: var(--forest-800);
      font-size: 48px;
      box-shadow: 0 0 0 10px rgba(226, 239, 232, 0.5);
    }

    h1 {
      margin: 0 0 12px;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 36px;
    }

    p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.6; }

    .slogan {
      margin-top: 20px;
      font-family: "Anek Kannada", sans-serif;
      font-weight: 600;
      color: var(--saffron-600);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 32px;
      padding: 13px 28px;
      border-radius: 999px;
      background: var(--saffron);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 24px -10px rgba(232, 121, 43, 0.75);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn:hover { background: var(--saffron-600); transform: translateY(-2px); }

    .tricolor {
      display: flex;
      height: 4px;
      width: 90px;
      margin: 32px auto 0;
      border-radius: 4px;
      overflow: hidden;
    }
    .tricolor span { flex: 1; }
    .tricolor span:nth-child(1) { background: #ff9933; }
    .tricolor span:nth-child(2) { background: #ddd; }
    .tricolor span:nth-child(3) { background: #138808; }
  </style>
</head>

<body>
  <main class="card">
    <img class="logo" src="assets/images/hn-logo.svg" alt="Harish Nagaraju" />
    <div class="check" aria-hidden="true"><i class="bi bi-check-lg"></i></div>
    <h1>Success</h1>
    <p>We received your request;<br />we'll be in touch shortly!</p>
    <p class="slogan" lang="kn">ಜನಸೇವೆಯೇ ಸಂಕಲ್ಪ | ನಮ್ಮ ಜನರೇ ನಮ್ಮ ಶಕ್ತಿ</p>
    <a class="btn" href="index.html" title="Back to Home"><i class="bi bi-arrow-left"></i> Back to Home</a>
    <div class="tricolor" aria-hidden="true"><span></span><span></span><span></span></div>
  </main>

  <script>
    window.onload = function () {
      document.addEventListener(
        "contextmenu",
        function (e) {
          e.preventDefault();
        },
        false
      );
      document.addEventListener(
        "keydown",
        function (e) {
          // "F12" key
          if (e.keyCode == 123) {
            disabledEvent(e);
          }
          // "U" key
          if (e.ctrlKey && e.keyCode == 85) {
            disabledEvent(e);
          }
          // "I" key
          if (e.ctrlKey && e.shiftKey && e.keyCode == 73) {
            disabledEvent(e);
          }
          // "J" key
          if (e.ctrlKey && e.shiftKey && e.keyCode == 74) {
            disabledEvent(e);
          }
          // "S" key + macOS
          if (
            e.keyCode == 83 &&
            (navigator.platform.match("Mac") ? e.metaKey : e.ctrlKey)
          ) {
            disabledEvent(e);
          }
        },
        false
      );
      function disabledEvent(e) {
        if (e.stopPropagation) {
          e.stopPropagation();
        } else if (window.event) {
          window.event.cancelBubble = true;
        }
        e.preventDefault();
        return false;
      }
    };
  </script>
</body>

</html>
